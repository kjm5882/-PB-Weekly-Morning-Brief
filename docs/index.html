<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 시황 브리핑</title>
<style>
  :root{
    --ma-orange:#FF6600;
    --ma-orange-tint:#FFE0CC;
    --ma-orange-pale:#FFF6F0;
    --ma-blue:#002060;
    --ma-blue-title:#00427A;
    --ma-text:#3C3C3B;
    --ma-text-sub:#595959;
    --ma-rule:#BFBFBF;
    --ma-table-head:#7F7F7F;
    --ma-bg-soft:#ECEFF4;
    --ma-badge:#E6E6E6;
    --ma-warn:#C00000;
    --ma-chart-black:#1A1A1A;

    --f-bold:"KoPub돋움체_Pro Bold","KoPubWorld돋움체 Bold","맑은 고딕",sans-serif;
    --f-body:"KoPub돋움체_Pro Medium","KoPubWorld돋움체 Medium","맑은 고딕",sans-serif;
    --f-light:"KoPub돋움체_Pro Light","KoPubWorld돋움체 Light","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:#fff; color:var(--ma-text);
    font-family:var(--f-body); line-height:1.42;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:0 24px; }

  /* ---------- Sticky quick nav ---------- */
  .quicknav{
    position:sticky; top:0; z-index:50;
    background:#fff; border-bottom:1px solid var(--ma-rule);
  }
  .quicknav .inner{
    max-width:960px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; gap:4px;
    height:42px; overflow-x:auto;
  }
  .quicknav .brand{
    font-family:var(--f-bold); font-size:12.5px; color:var(--ma-blue);
    padding-right:12px; margin-right:8px; border-right:1px solid var(--ma-rule);
    white-space:nowrap;
  }
  .quicknav a{
    font-family:var(--f-body); font-size:12.5px; color:var(--ma-text-sub);
    text-decoration:none; padding:5px 11px; border-radius:16px;
    white-space:nowrap; transition:background .15s, color .15s;
  }
  .quicknav a:hover{ background:var(--ma-bg-soft); color:var(--ma-text); }
  .quicknav a.active{ background:var(--ma-blue); color:#fff; }

  /* ---------- Hero ---------- */
  .hero{ padding:22px 0 12px 0; }
  .hero .eyebrow{
    font-family:var(--f-bold); font-size:12.5px; color:var(--ma-orange);
    letter-spacing:.02em; margin-bottom:5px;
  }
  .hero .week{
    font-family:var(--f-light); font-size:13px; color:var(--ma-text-sub);
    margin-bottom:10px;
  }
  .hero h1{
    font-family:var(--f-bold); color:var(--ma-blue);
    font-size:clamp(23px,3.6vw,34px); line-height:1.22; margin:0 0 6px 0;
  }
  .hero .sub{
    font-family:var(--f-body); font-size:15px; color:var(--ma-text); max-width:680px;
  }

  /* ---------- Section shell ---------- */
  section.block{ padding:24px 0 4px 0; scroll-margin-top:52px; }
  .block .kicker{
    font-family:var(--f-bold); font-size:12.5px; color:var(--ma-orange);
    margin-bottom:3px;
  }
  .block h2{
    font-family:var(--f-bold); color:var(--ma-blue);
    font-size:clamp(19px,2.3vw,24px); margin:0 0 4px 0;
  }
  .block .desc{
    font-family:var(--f-light); font-size:13.5px; color:var(--ma-text-sub);
    margin-bottom:12px;
  }

  /* reveal-on-scroll */
  .reveal{ opacity:0; transform:translateY(10px); transition:opacity .4s ease, transform .4s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .reveal{ opacity:1; transform:none; transition:none; } }

  /* ---------- Market rows (name · value · chg · mini chart · AI comment) ---------- */
  .mrow3{
    display:grid; grid-template-columns:1.1fr .95fr .8fr 1fr 2.3fr;
    align-items:center; gap:14px;
    padding:9px 0; border-bottom:1px solid var(--ma-rule);
  }
  .mrow3:first-child{ border-top:1px solid var(--ma-rule); }
  @media (max-width:760px){
    .mrow3{ grid-template-columns:1fr 1fr; row-gap:5px; }
    .mrow3-chart{ grid-column:1/-1; order:3; }
    .mrow3-comment{ grid-column:1/-1; order:4; }
  }
  .mrow3-name{ font-family:var(--f-bold); font-size:14px; color:var(--ma-text); }
  .mrow3-value{ font-family:var(--f-body); font-size:13px; color:var(--ma-text-sub); }
  .mrow3-chg{ font-family:var(--f-bold); font-size:13.5px; }
  .mrow3-chart{ width:72px; height:22px; }
  .mrow3-comment{ font-family:var(--f-body); font-size:12.5px; color:var(--ma-text); }

  /* ---------- Sparkline cards (금리/금) ---------- */
  .spark-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  @media (max-width:700px){ .spark-grid{ grid-template-columns:1fr; } }
  .spark-card{ border:1px solid var(--ma-rule); padding:11px 13px 9px 13px; display:flex; flex-direction:column; }
  .spark-card .spark-foot{ margin-top:auto; padding-top:8px; }
  .spark-title{ font-family:var(--f-bold); font-size:12.5px; color:var(--ma-blue); margin-bottom:6px; }
  .spark-vals{ display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
  .spark-vals > div{ display:flex; justify-content:space-between; align-items:baseline; }
  .spv-label{ font-family:var(--f-light); font-size:11.5px; color:var(--ma-text-sub); }
  .spv-num{ font-family:var(--f-bold); font-size:14px; color:var(--ma-text); }
  .spark-chart{ margin:3px 0 4px 0; }
  .spark-foot{ font-family:var(--f-light); font-size:10.5px; color:var(--ma-text-sub); }
  .spark-foot em{ font-style:normal; color:var(--ma-text-sub); }
  .rate-rows{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-bottom:2px; }
  .rate-row{
    display:flex; flex-direction:column;
    padding:0 14px; border-left:1px solid var(--ma-rule);
  }
  .rate-row:first-child{ border-left:none; padding-left:0; }
  .rate-row:last-child{ padding-right:0; }
  .rate-row .rlabel{ font-family:var(--f-light); font-size:11px; color:var(--ma-text-sub); margin-bottom:2px; }
  .rate-row .rval{ font-family:var(--f-bold); font-size:17px; color:var(--ma-text); }
  .rate-row .rchg{ font-family:var(--f-bold); font-size:11.5px; margin-top:1px; margin-bottom:7px; }
  .rate-row .rchart{ height:56px; }

  .fx-heading{
    font-family:var(--f-bold); font-size:13px; color:var(--ma-text);
    margin-top:16px; margin-bottom:6px;
  }
  .fx-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:700px){ .fx-grid{ grid-template-columns:1fr; } }

  /* ---------- sector chips ---------- */
  .sector-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
  @media (max-width:700px){ .sector-grid{ grid-template-columns:1fr; } }
  .sector-col .col-title{ font-family:var(--f-bold); font-size:12.5px; margin-bottom:6px; }
  .sector-col.up .col-title{ color:var(--ma-blue-title); }
  .sector-col.down .col-title{ color:var(--ma-warn); }
  .chip-list{ display:flex; flex-direction:column; gap:5px; }
  .chip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--ma-bg-soft); padding:6px 11px; font-size:13px;
  }
  .chip .cname{ font-family:var(--f-body); color:var(--ma-text); }
  .chip .cval{ font-family:var(--f-bold); font-size:12.5px; }
  .chip .cval.up{ color:var(--ma-blue-title); }
  .chip .cval.down{ color:var(--ma-warn); }

  /* ---------- flow cards (수급) ---------- */
  .flow-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .flow-table th{
    font-family:var(--f-bold); font-size:12.5px; color:#fff; background:var(--ma-table-head);
    padding:8px 10px; text-align:center;
  }
  .flow-table th:first-child{ text-align:left; }
  .flow-table td{
    font-family:var(--f-bold); font-size:14px; text-align:center;
    padding:9px 10px; border-bottom:1px solid var(--ma-rule);
  }
  .flow-table td:first-child{ text-align:left; font-family:var(--f-bold); color:var(--ma-text); }

  /* ---------- Timeline (issues, 같은 날짜는 병합 표시) ---------- */
  .tl{ display:flex; flex-direction:column; }
  .tl-group{
    display:grid; grid-template-columns:88px 1fr;
    border-top:1px solid var(--ma-rule); gap:12px;
  }
  .tl-group:last-child{ border-bottom:1px solid var(--ma-rule); }
  @media (max-width:700px){ .tl-group{ grid-template-columns:76px 1fr; } }
  .tl-date{ font-family:var(--f-bold); font-size:12.5px; color:var(--ma-blue); padding:12px 0; }
  .tl-entries{ display:flex; flex-direction:column; }
  .tl-entry{
    display:grid; grid-template-columns:54px 1fr; gap:12px;
    padding:12px 0; align-items:flex-start;
  }
  .tl-entry + .tl-entry{ border-top:1px dashed var(--ma-rule); }
  @media (max-width:700px){ .tl-entry{ grid-template-columns:46px 1fr; } }
  .tl-imp{
    font-family:var(--f-bold); font-size:10.5px; text-align:center;
    padding:2px 0; border-radius:2px; color:#fff; height:fit-content;
  }
  .tl-imp.high{ background:var(--ma-warn); }
  .tl-imp.mid{ background:var(--ma-orange); }
  .tl-imp.low{ background:var(--ma-table-head); }
  .tl-title{ font-family:var(--f-bold); font-size:14px; color:var(--ma-text); }
  .tl-flag{
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; border-radius:50%; background:var(--ma-bg-soft);
    font-size:10px; margin-right:6px; overflow:hidden; vertical-align:middle;
  }
  .tl-desc{ font-family:var(--f-light); font-size:12.5px; color:var(--ma-text-sub); margin-top:2px; }

  /* ---------- Implication cards ---------- */
  .impl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:2px; }
  @media (max-width:700px){ .impl-grid{ grid-template-columns:1fr; } }
  .impl-card{ border:1px solid var(--ma-rule); padding:12px 13px; display:flex; flex-direction:column; gap:5px; }
  .impl-card .icat{
    display:inline-block; font-family:var(--f-bold); font-size:11px; color:#fff;
    background:var(--ma-table-head); padding:2px 9px; border-radius:2px; width:fit-content;
  }
  .impl-card .itext{ font-family:var(--f-body); font-size:13.5px; color:var(--ma-text); }
  .impl-card .iaction{
    font-family:var(--f-bold); font-size:12.5px; color:var(--ma-blue);
    padding-top:5px; border-top:1px dashed var(--ma-rule);
  }
  .impl-card .iaction .arw{ color:var(--ma-orange); margin-right:5px; }

  .highlight-box{
    background:var(--ma-orange-tint); padding:12px 16px; margin-top:12px;
    font-family:var(--f-bold); font-size:14.5px; color:var(--ma-text);
  }
  .highlight-box .arw{ color:var(--ma-orange); margin-right:6px; }

  footer{
    border-top:1px solid var(--ma-rule); padding:12px 0 20px 0;
    font-family:var(--f-light); font-size:11px; color:var(--ma-text-sub);
    display:flex; justify-content:space-between;
  }
</style>
</head>
<body>

<nav class="quicknav">
  <div class="inner">
    <span class="brand">디지털PB본부</span>
    <a href="#overseas">해외시황</a>
    <a href="#domestic">국내시황</a>
    <a href="#issues">주요이슈</a>
    <a href="#implications">연계시사점</a>
  </div>
</nav>

<div class="wrap">

  <!-- ================= HERO / TL;DR ================= -->
  <section class="hero" id="top">
    <div class="eyebrow">주간회의 시황 브리핑</div>
    <div class="week" id="weekLabel"></div>
    <h1 id="heroHeadline"></h1>
    <div class="sub" id="heroSub"></div>
  </section>

  <section class="block reveal" id="overseas">
    <div class="kicker">GLOBAL MARKET</div>
    <h2>해외 시황</h2>
    <div class="desc" id="overseasDesc"></div>
    <div id="overseasRows"></div>
    <div class="spark-grid" id="sparkGrid"></div>
    <div class="fx-heading">환율</div>
    <div class="fx-grid" id="fxGrid"></div>
  </section>

  <!-- ================= 국내 시황 ================= -->
  <section class="block reveal" id="domestic">
    <div class="kicker">DOMESTIC MARKET</div>
    <h2>국내 시황</h2>
    <div class="desc" id="domesticDesc"></div>
    <div id="domesticRows"></div>

    <div style="margin-top:30px; font-family:var(--f-bold); font-size:14.5px; color:var(--ma-text);">수급 동향 (순매수)</div>
    <table class="flow-table" id="flowTable"></table>
  </section>

  <!-- ================= 주요 이슈 ================= -->
  <section class="block reveal" id="issues">
    <div class="kicker">THIS WEEK'S AGENDA</div>
    <h2>이번주 주요 이슈 · 일정</h2>
    <div class="desc" id="issuesDesc"></div>
    <div class="tl" id="issuesList"></div>
  </section>

  <!-- ================= 연계 시사점 ================= -->
  <section class="block reveal" id="implications">
    <div class="kicker">SO WHAT — 우리 업무 연계</div>
    <h2 id="implHeadline"></h2>
    <div class="impl-grid" id="implGrid"></div>
    <div class="highlight-box" id="implHighlight"></div>
  </section>

  <footer>
    <span id="footerLeft">디지털PB본부 주간회의 · Mirae Asset</span>
    <span id="footerRight"></span>
  </footer>

</div>

===================================================================== */

function dirClass(chgStr){
  if(chgStr.includes("▲") || chgStr.includes("+")) return "up";
  if(chgStr.includes("▼") || chgStr.includes("-")) return "down";
  return "flat";
}
function stripArrow(s){ return s.replace(/[▲▼]/g,""); }
function flowColor(v){
  if(typeof v !== "string") return "var(--ma-text)";
  if(v.includes("+")) return "var(--ma-warn)";
  if(v.includes("-")) return "var(--ma-blue-title)";
  return "var(--ma-text)";
}

/* ---- 3년 간이차트 (sparkline) ----
   values: 숫자 배열, opts: { baseline?: number, color?: string, warnBelowBaseline?: boolean, height?: number } */
function sparkline(values, opts = {}){
  const w = 220, h = opts.height || 56, pad = 4;
  const hasBase = typeof opts.baseline === "number";
  const domain = hasBase ? values.concat([opts.baseline]) : values;
  let min = Math.min(...domain), max = Math.max(...domain);
  if(min === max){ min -= 1; max += 1; }
  const xStep = (w - pad*2) / (values.length - 1);
  const yOf = (v) => h - pad - ((v - min) / (max - min)) * (h - pad*2);

  const last = values[values.length-1];
  const lineColor = opts.warnBelowBaseline && hasBase && last < opts.baseline ? "var(--ma-warn)" : (opts.color || "var(--ma-blue-title)");

  const pts = values.map((v,i) => `${(pad+i*xStep).toFixed(1)},${yOf(v).toFixed(1)}`).join(" ");
  const lastX = (pad+(values.length-1)*xStep).toFixed(1);
  const lastY = yOf(last).toFixed(1);

  let baseLine = "";
  if(hasBase){
    const by = yOf(opts.baseline).toFixed(1);
    baseLine = `<line x1="${pad}" y1="${by}" x2="${w-pad}" y2="${by}" stroke="var(--ma-rule)" stroke-width="1" stroke-dasharray="3,3" />`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;">
      ${baseLine}
      <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="${lastX}" cy="${lastY}" r="3.2" fill="var(--ma-orange)" />
    </svg>`;
}

/* 상승=빨강, 하락=파랑 (국내 관례를 해외지수·환율에도 동일 적용) */
function renderMarketRow(r){
  const posUp = r.pct >= 0;
  const color = posUp ? "var(--ma-warn)" : "var(--ma-blue-title)";
  const hist = (r.history && r.history.length > 1) ? r.history : [0,0];
  return `<div class="mrow3">
      <div class="mrow3-name">${r.name}</div>
      <div class="mrow3-value">${r.value}</div>
      <div class="mrow3-chg" style="color:${color}">${stripArrow(r.chg)}</div>
      <div class="mrow3-chart">${sparkline(hist, { color, height: 22 })}</div>
      <div class="mrow3-comment">${r.comment}</div>
    </div>`;
}

function renderIssueEntry(it){
  const label = { high:"상", mid:"중", low:"하" }[it.importance] || "중";
  return `<div class="tl-entry">
      <div class="tl-imp ${it.importance}">${label}</div>
      <div>
        <div class="tl-title"><span class="tl-flag">${it.flag || "🏳️"}</span>${it.title}</div>
        <div class="tl-desc">${it.desc}</div>
      </div>
    </div>`;
}

function parseIssueDateKey(dateStr){
  // "8/12(수)" 같은 문자열에서 월/일을 뽑아 정렬 가능한 숫자로 변환
  const m = String(dateStr).trim().match(/(\d+)\s*\/\s*(\d+)/);
  if(!m) return 999999;
  return parseInt(m[1], 10) * 100 + parseInt(m[2], 10);
}

function renderIssueGroups(issues){
  // 1) 날짜 문자열 앞뒤 공백 정리 + 2) 날짜순 정렬 (AI 응답 순서에 의존하지 않음)
  const sorted = issues
    .map(it => ({ ...it, date: String(it.date).trim() }))
    .sort((a, b) => parseIssueDateKey(a.date) - parseIssueDateKey(b.date));

  // 3) 같은 날짜가 연속으로 오면 하나의 그룹으로 묶어 날짜 칸을 병합 표시
  const groups = [];
  for(const it of sorted){
    const last = groups[groups.length - 1];
    if(last && last.date === it.date){
      last.items.push(it);
    } else {
      groups.push({ date: it.date, items: [it] });
    }
  }
  return groups.map(g => `
    <div class="tl-group">
      <div class="tl-date">${g.date}</div>
      <div class="tl-entries">${g.items.map(renderIssueEntry).join("")}</div>
    </div>`).join("");
}

  document.getElementById("fxGrid").innerHTML = FX.map(renderFxCard).join("");

    <tr><th>구분</th><th>외국인</th><th>기관</th><th>개인</th></tr>

      <tr>

}

/* ---- scroll reveal ---- */
function setupReveal(){
  const els = document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){
    els.forEach(el => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

/* ---- active nav highlight ---- */
function setupNav(){
  const links = document.querySelectorAll(".quicknav a");
  const sections = Array.from(links).map(a => document.querySelector(a.getAttribute("href")));
  function onScroll(){
    let idx = 0;
    const y = window.scrollY + 90;
    sections.forEach((sec,i) => { if(sec && sec.offsetTop <= y) idx = i; });
    links.forEach((l,i) => l.classList.toggle("active", i === idx));
  }
  window.addEventListener("scroll", onScroll, { passive:true });
  onScroll();
}

build();
setupReveal();
setupNav();
</script>
